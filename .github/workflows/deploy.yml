# Deploy: UAT branch → UAT server; main → production.
# Configure GitHub Environments "uat" and "production" with secrets (see docs/release-workflow.md).
name: Deploy

on:
  push:
    branches: [UAT, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'uat' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            BRANCH="${{ github.ref_name }}"
            cd "$APP_DIR"
            git fetch origin
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
            npm ci
            npm run db:generate:all
            # Migrations: run against env-specific DB URLs on the server (see docs/release-workflow.md)
            npm run db:migrate:all || true
            npm run build:all
            # Restart your process manager (adjust to pm2, systemd, docker compose, etc.)
            if command -v docker >/dev/null 2>&1 && [ -f docker-compose.yml ]; then
              docker compose pull || true
              docker compose up -d --build
            fi
            echo "Deployed branch $BRANCH at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
